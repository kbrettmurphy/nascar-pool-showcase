name: Verify public showcase

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Reject private-feature references and common secret patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          forbidden = [
              re.compile(r'busch[ -]?girls', re.I),
              re.compile(r'buschgirl', re.I),
              re.compile(r'service.role.key', re.I),
              re.compile(r'admin.session.secret', re.I),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'(?i)(?:api[_-]?key|secret|token)\s*[:=]\s*["\x27][A-Za-z0-9_\-]{24,}'),
          ]
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js', '.json', '.md', '.yml', '.yaml', '.html', '.css', '.sql'}:
                  continue
              if path.as_posix() == '.github/workflows/verify.yml':
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for pattern in forbidden:
                  if pattern.search(text):
                      hits.append(f'{path}: prohibited pattern')
          if hits:
              raise SystemExit('\n'.join(hits))
          print('Public showcase privacy pattern check passed')
          PY
